name: CI

on:
  push:
    branches: [exp]
  pull_request:
    branches: [exp]

# Jawne minimum uprawnien (CodeQL: "Workflow does not contain permissions")
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 3 testy sprzetowe (GPU, coretemp/thinkpad) przechodza tylko na
      # prawdziwym sprzecie - na runnerze CI ich pomijamy. Reszta: 141 testow.
      - name: Run tests
        run: >
          python -m pytest -q
          --deselect tests/test_cli_api.py::TestAPI::test_inventory_gpu
          --deselect tests/test_sys_reader.py::TestSensors::test_coretemp_present
          --deselect tests/test_sys_reader.py::TestInventory::test_gpu_found
