name: CodeQL

on:
  push:
    branches: [exp]
  pull_request:
    branches: [exp]
  schedule:
    # cotygodniowy skan, zeby lapac tez regresje bez pushy
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      security-events: write  # upload wynikow skanowania
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
